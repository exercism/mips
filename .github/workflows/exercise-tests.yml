name: Exercise tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-2025
          - macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: 17
          distribution: temurin

      - name: Test exercises
        run: ./bin/test test-all

  tests:
    name: Tests
    needs: test
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check that every configuration passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "The exercise tests failed on at least one configuration."
            exit 1
          fi
